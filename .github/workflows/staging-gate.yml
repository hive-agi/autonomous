name: staging-gate

# staging is a GATE, not a mirror: a push to staging (or a PR into main) runs
# every portable suite against the DECLARED classpath (no local.deps.edn).
# Only a green staging is promoted to main, where release.yml mints the
# version. This workflow never publishes.
on:
  push:
    branches: [staging]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jvm:
    name: JVM unit suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
          bb: latest
      # The pins must resolve from the registries before anything else is
      # worth running: this is the step a dependency bump can break.
      - name: Resolve declared classpath
        run: clojure -P -M:test
      - name: Test
        run: clojure -M:test unit

  # The bridge artifact (bridge/), built against this checkout's runtime.
  jvm-bridge:
    name: JVM suite (bridge)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: bridge
    env:
      DEV_LOCAL: '{:aliases {:dev/local {:override-deps {io.github.hive-agi/autonomous {:local/root ".."}}}}}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
          bb: latest
      - name: Resolve declared classpath
        run: clojure -Sdeps "$DEV_LOCAL" -P -M:dev/local:test
      # Every bridge source must load on its declared classpath. Pass 1 loads
      # all of them on the bare classpath except OPTIONAL, the nses that
      # statically require an alias-only dep; pass 2 loads OPTIONAL with those
      # aliases (datahike, http-kit, reitit-ring for ring.websocket, bb-mcp).
      - name: Compile
        env:
          OPTIONAL: >-
            autonomous.bridge.ledger.datahike
            autonomous.mcp.http.kit
            autonomous.ws.ring-listener
            autonomous.bridge.nrepl-wire
        run: |
          set -euo pipefail
          LOAD='
            (require (quote clojure.java.io) (quote clojure.string))
            (let [[mode & names] *command-line-args*
                  optional (set (map symbol (clojure.string/split (System/getenv "OPTIONAL") #"\s+")))
                  root (.toPath (clojure.java.io/file "src"))
                  all (->> (file-seq (clojure.java.io/file "src"))
                           (filter #(re-find #"\.clj[c]?$" (.getName %)))
                           (map #(-> (str (.relativize root (.toPath %)))
                                     (clojure.string/replace #"\.clj[c]?$" "")
                                     (clojure.string/replace "/" ".")
                                     (clojure.string/replace "_" "-")
                                     symbol))
                           sort)
                  missing (remove (set all) optional)
                  nses (if (= mode "optional") (filter optional all) (remove optional all))]
              (when (seq missing)
                (throw (ex-info "OPTIONAL names a ns with no source file" {:missing missing})))
              (doseq [n nses] (require n))
              (println "loaded" (count nses) mode "bridge namespaces of" (count all)))'
          clojure -Sdeps "$DEV_LOCAL" -M:dev/local -e "$LOAD" base
          clojure -Sdeps "$DEV_LOCAL" -M:dev/local:datahike:ws:ring:cljw -e "$LOAD" optional
      # kaocha exits 0 with no tests: fail when fewer tests ran than the
      # deftest forms of the unit suites (trifecta macros only add to it).
      - name: Test
        run: |
          set -euo pipefail
          clojure -Sdeps "$DEV_LOCAL" -M:dev/local:test unit --no-color 2>&1 | tee kaocha.log
          MIN=$(grep -rL --include='*_test.clj' --include='*_test.cljc' '\^:integration' test ../example/sim/test \
                  | xargs cat | grep -Ec '^\(deftest ' || true)
          RAN=$(grep -Eo '^[0-9]+ tests?, ' kaocha.log | grep -Eo '^[0-9]+' || echo 0)
          echo "bridge unit tests ran: $RAN, floor (deftest forms): $MIN"
          if [ "$RAN" -lt "$MIN" ] || [ "$RAN" -eq 0 ]; then
            echo "kaocha ran $RAN tests, fewer than the $MIN deftest forms under bridge/test"
            exit 1
          fi

  bb:
    name: babashka suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          bb: latest
      - name: Test
        run: bb test

  cljs:
    name: ClojureScript suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
      - name: Install node dependencies
        run: npm ci
      - name: Compile the test build
        run: clojure -M:cljs -m shadow.cljs.devtools.cli compile test
      - name: Test
        run: node target/cljs-test/test.js

  # bb test-rf2: autonomous.re-frame2 against real re-frame2, a gitlib
  # (day8/re-frame2 at the sha deps.edn :cljs-rf2 pins) in place of re-frame 1.
  cljs-rf2:
    name: ClojureScript suite on re-frame2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
      - name: Install node dependencies
        run: npm ci
      # The git dep is fetched here, so a moved or unreachable sha fails
      # this step rather than the compile.
      - name: Resolve declared classpath
        run: clojure -P -M:cljs-rf2
      - name: Compile the test build
        run: clojure -M:cljs-rf2 -m shadow.cljs.devtools.cli compile rf2-test
      - name: Test
        run: node target/cljs-rf2-test/test.js
