# The compose half of the fleet demo. hive-compose starts a section's host
# programs once its containers are up, so the project needs one service:
# this anchor, which does nothing. `compose up target=autonomous-fleet/anchor`
# then starts the todo UI, the orders service and the inventory service
# (example/fleet/hive-compose.edn).
name: autonomous-fleet
services:
  anchor:
    image: busybox:1.36
    command: ["sleep", "infinity"]
    init: true
