name: release

# Every push to main that changes the library releases a patch: gate on the
# suite, tag v<next patch>, deploy to Clojars. README-only commits mint nothing,
# because a published pom is immutable.
#
# The version comes from the tags, not from a commit back to main. VERSION in
# the tree is a FLOOR (raise it in a staging PR to open a new minor line). A
# floor above the newest v* tag is released as written; otherwise this run
# releases patch+1 of the newest tag. A bump commit on main
# would be one staging lacks and would make every staging->main PR conflict.
#
# Secrets (per-repo or hive-agi org-wide): CLOJARS_USERNAME, CLOJARS_DEPLOY_TOKEN.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'deps.edn'
      - 'version.edn'
      - 'VERSION'
      # The suite gates the release, so a test-only change must be able to
      # trigger a run, or a test regression stays invisible until a src push.
      - 'test/**'
      - 'tests.edn'
      # Until the bridge is its own artifact, the root jar ships bridge/src.
      - 'bridge/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest

      # Gate BEFORE the tag: a red suite must not mint a version.
      # The :integration suite needs live app runtimes and stays local.
      - name: Test (JVM unit suite)
        run: clojure -M:test unit

      # The root jar ships bridge/src (version.edn :src-dirs), so its suite
      # gates the release too, against this checkout's runtime.
      - name: Test (JVM unit suite, bridge)
        working-directory: bridge
        env:
          DEV_LOCAL: '{:aliases {:dev/local {:override-deps {io.github.hive-agi/autonomous {:local/root ".."}}}}}'
        run: clojure -Sdeps "$DEV_LOCAL" -M:dev/local:test unit

      # A floor above every tag opens a new line and is released as written
      # (VERSION 0.2.0 releases 0.2.0); otherwise the newest tag gets +1 patch.
      - name: Resolve release base from tags
        run: |
          set -euo pipefail
          FLOOR=$(tr -d '[:space:]' < VERSION)
          LAST=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1 | sed 's/^v//')
          BASE=$(printf '%s\n%s\n' "$FLOOR" "${LAST:-$FLOOR}" | sort -V | tail -n1)
          if [ -z "$LAST" ] || { [ "$BASE" = "$FLOOR" ] && [ "$FLOOR" != "$LAST" ]; }; then
            BUMP=false
          else
            BUMP=true
          fi
          echo "VERSION floor $FLOOR, newest tag ${LAST:-none}: base $BASE, bump $BUMP"
          printf '%s\n' "$BASE" > VERSION
          echo "BUMP=$BUMP" >> "$GITHUB_ENV"

      - name: Bump patch version
        if: env.BUMP == 'true'
        run: clojure -T:build bump :level :patch

      - name: Tag
        run: |
          set -euo pipefail
          VER=$(tr -d '[:space:]' < VERSION)
          git config user.name  "hive-ci"
          git config user.email "ci@hive-agi.local"
          # Annotated, so the next run's tag scan and `git describe` see it.
          git tag -a "v$VER" -m "release $VER"
          git push origin "refs/tags/v$VER"

      - name: Deploy
        env:
          # deps-deploy and hive-build read CLOJARS_PASSWORD; the org secret
          # is CLOJARS_DEPLOY_TOKEN.
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_DEPLOY_TOKEN }}
        run: clojure -T:build deploy
