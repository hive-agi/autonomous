syntax = "proto3";

package autonomous.v1;

// Caller is the coordinate that joins the agent trace to the app trace: the
// agent's chat point, the task/attempt correlation, and the W3C trace context.
// It is read from the MCP tools/call request `_meta` and recorded on the call
// entry as :caller, so the agent trace and the app trace join.
//
// SHAPE: FLAT, mirroring the EDN shape of S7 (branch feat/caller-coordinate,
// autonomous.domain.schema/Caller and autonomous.domain.caller). The EDN map
// is flat (:chat-point, :run/task-id, :run/attempt, :trace/traceparent,
// :trace/tracestate), so this proto is flat too. The earlier draft nested a
// Correlation message; that nesting is dropped (see MAPPING.md, "Caller
// reconcile"). Correlation's two fields are inlined here. A product is not a
// sum: no oneof, and no message for what the EDN carries inline.
//
// Every field is optional; an absent _meta reads as no caller, and an invalid
// field is dropped and named, never an error (autonomous.domain.caller/
// from-meta).
message Caller {
  // :chat-point. The agent step that issued the call.
  ChatPoint chat_point = 1 [json_name = "chat-point"];

  // :run/task-id. The task (for example the kanban card), when the run names
  // one.
  optional string run_task_id = 2 [json_name = "run/task-id"];

  // :run/attempt. The try, when the run names one.
  optional int64 run_attempt = 3 [json_name = "run/attempt"];

  // :trace/traceparent. The W3C traceparent. Optional: an invalid traceparent
  // is dropped and named, never an error. The _meta wire key is the spec's
  // own UNPREFIXED "traceparent" (SEP-414); the EDN key is :trace/traceparent.
  optional string traceparent = 4 [json_name = "trace/traceparent"];

  // :trace/tracestate. The W3C tracestate. _meta key "tracestate".
  optional string tracestate = 5 [json_name = "trace/tracestate"];
}

// ChatPoint is one position in one conversation, however many branches lie
// beneath it: the run id and the lineage coordinates seq and turn.
// Mirrors hive-agent.loop.chat-point/ChatPoint and
// autonomous.domain.schema/ChatPoint
// [:map [:run-id :string] [:seq [:int {:min 0}]] [:turn [:int {:min 0}]]].
message ChatPoint {
  // :run-id
  string run_id = 1 [json_name = "run-id"];

  // :seq, the position in the lineage.
  int64 seq = 2;

  // :turn, the agent turn the position belongs to.
  int64 turn = 3;
}
